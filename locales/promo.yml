en:
  commands:
    promo:
      description: Activate a juicy promo code
      request: 'Enter a promo code:'
      success:
        template: Promo code activated! %{ending}
        singular: Your tits gained <b>%{growth} cc</b> in one chat. 🍒
        plural: Your tits gained <b>%{growth} cc</b> in <b>%{affected_chats}</b> chats! 🍒
      errors:
        no_activations_left: That promo code does not exist, expired, or has already been drained dry 😞
        already_activated: You already used that promo code, greedy slut 🤨
        no_dicks: You do not have any tits growing yet. Add me to a chat and use <code>/grow</code>!
ru:
  commands:
    promo:
      description: Активировать промокод
      request: 'Введи промокод:'
      success:
        template: Промокод успешно активирован! %{ending}
        singular: Твой писюн вырос на <b>%{growth}</b> см в одном чате.
        plural: Твой писюн вырос на <b>%{growth}</b> см в <b>%{affected_chats}</b> %{word_chats}.
      errors:
        no_activations_left: Мне очень жаль, но кажется, что либо этого промокода никогда не существовало, либо он истёк, либо все активации уже были использованы 😞
        already_activated: Кажется, ты уже использовал данный промокод ранее 🤨
        no_dicks: Кажется, ты ещё не начал растить ни одного писюна? 🤔 Сейчас самое время добавить меня в какой-либо чат и выполнить команду <code>/grow</code>!
      inline:
        switch_button: Активировать промокод "%{code}"…
it:
  commands:
    promo:
      description: Attiva un codice promozionale
      request: 'Inserisci un codice promozionale:'
      success:
        template: Hai attivato questo codice promozionale con successo! %{ending}
        singular: Il tuo pene è cresciuto di <b>%{growth}</b> cm in un gruppo.
        plural: Il tuo pene è cresciuto di <b>%{growth}</b> cm in <b>%{affected_chats}</b> gruppi!
      errors:
        no_activations_left: Mi dispiace ma questo codice promozionale non esiste o è scaduto 😞
        already_activated: Sembra che tu abbia già utilizzato questo codice promozionale 🤨
        no_dicks: Non hai ancora alcun pene. 🤔 Devi aggiungermi ad un gruppo ed eseguire il comando <code>/grow</code>!
      inline:
        switch_button: Attiva il codice promozionale '%{code}'…
fa:
