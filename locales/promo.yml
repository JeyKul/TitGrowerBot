        singular: کیرت تو یه چت <b>%{growth}</b> سانت رشد کرد.
        plural: کیرت تو <b>%{affected_chats}</b> چت، <b>%{growth}</b> سانت رشد کرد!
      errors:
        no_activations_left: متأسفم، ولی این کد تخفیف یا وجود نداره، یا منقضی شده، یا ظرفیتش پر شده 😞
