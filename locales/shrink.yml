en:
  commands:
    shrink:
      notification:
        header: '✂✂️ <b>NEGLECTED TITS ALERT!</b> These greedy sluts have not grown in %{days} days, so their soft little tits got trimmed:'
        line: — <b><a href="tg://user?id=%{uid}">%{name}</a></b> lost <b>%{lost} cc</b> 😭 Now they have <b>%{length} cc</b> left. Feed those tits next time, whore~
      recent:
        header: ✂️ <b>Who's been shrinking lately:</b>
        line: — <b>%{name}</b> lost <b>%{lost}</b> cm
      empty: Silence… No one has shrunk lately. Guess everybody's keeping up the pace 💪
ru:
  commands:
    shrink:
