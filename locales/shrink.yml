        header: ✂️ <b>Кто у нас тут усох в последнее время:</b>
        line: — <b>%{name}</b> лишился <b>%{lost}</b> см
      empty: Тишина… Никто не усох за последнее время. Видать, все исправно тягают свои пиписьки 💪
