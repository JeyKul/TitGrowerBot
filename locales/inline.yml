        這個按鈕每次都需要點擊。更好的辦法是把機器人加入本群並點擊它的啟用按鈕！那樣用一般指令就夠了，內聯結果也會和它們合併計算。


        請務必在本群升級為超級群組之前完成：否則這裡透過內聯模式遊玩的一切都將永久遺失。'
      button: 點我！
