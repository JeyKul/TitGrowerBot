en:
  commands:
    loan:
      description: Tits in the negatives? Take a loan!
      debt: 'Tit debt remaining: <b>%{debt} cc</b>'
      confirmation:
        text: Your sad, empty tits will be reset to zero, but every future growth is taxed by <b>%{payout_percentage}</b> until you repay all <b>%{debt} cc</b>.
        buttons:
          agree: 💦 Give me the loan!
          disagree: No thanks
      callback:
        success: Your emergency tit loan has been approved!
        refused: The desperate little borrower refused the tit loan.
        payout_ratio_changed: The repayment rate changed after you opened this loan. Send the command again.
      errors:
        positive_length: Your tits are already above zero, greedy slut. Loans are for truly empty girls only.
ru:
  commands:
    loan:
      description: Минус? Возьми кредит!
      debt: Осталось выплатить <b>%{debt} см</b>
      confirmation:
        text: Твоя пропасть будет обнулена, но размер каждого прироста снизится на <b>%{payout_percentage}</b> до выплаты всех <b>%{debt} см</b>.
